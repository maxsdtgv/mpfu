# MPFU device profile — Microchip PIC16F1789
#
# Consumed by the mpfu host (-c 16f1789). All numbers may be decimal or 0x-hex.
# The host uses these to lay out the firmware image; the bootloader is built for
# the same chip and enforces the code-region / vector rules itself.

# Device ID as read from config space at word 0x8006 (DEVID). Used to verify the
# image matches the connected chip. 0xFFFF in an image = "any device".
device_id          = 0x302A

# Program flash size in words (0x0000 .. flash_words-1).
flash_words        = 0x4000

# Flash erase/write granularity, in words. Blocks are aligned to this.
row_words          = 32

# Bootloader code region (inclusive). The host must never place app data here.
bl_code_start      = 0x3800
bl_code_end        = 0x3FBF

# Bootloader flags row (owned by the bootloader; not part of the app image).
flags_row          = 0x3FC0

# Row that holds the application's relocated reset vector. StartApp jumps here.
app_vector_row     = 0x3FE0

# Blank/erased flash word value (14-bit parts read back 0x3FFF).
blank_word         = 0x3FFF

# Number of words at 0x0000 reserved for the bootloader's own reset trampoline
# (MOVLP;GOTO pair, possibly two-step). The host leaves these to the bootloader.
reset_vector_words = 4
